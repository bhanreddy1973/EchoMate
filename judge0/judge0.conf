################################################################################
# Judge0 CE Configuration
# https://github.com/judge0/judge0
################################################################################

# Database
POSTGRES_HOST=db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0password

# Redis
REDIS_HOST=redis
REDIS_PORT=6379

# Workers
RAILS_MAX_THREADS=5
RAILS_ENV=production
RAILS_LOG_TO_STDOUT=true

# Number of workers (increase for more concurrent executions)
COUNT=2

# Disable authentication for local development (no API key needed)
AUTHN_HEADER=
AUTHN_TOKEN=
AUTHZ_HEADER=
AUTHZ_TOKEN=

# Execution limits
CPU_TIME_LIMIT=10
CPU_EXTRA_TIME=5
WALL_TIME_LIMIT=20
MEMORY_LIMIT=256000
STACK_LIMIT=64000
MAX_PROCESSES_AND_OR_THREADS=60
MAX_FILE_SIZE=1024

# Enable all languages
ENABLE_BATCHED_SUBMISSIONS=true
ENABLE_WAIT_RESULT=true
ENABLE_COMPILER_OPTIONS=true
ENABLE_COMMAND_LINE_ARGUMENTS=true
ENABLE_SUBMISSION_DELETE=false
ENABLE_CALLBACKS=false

# Network inside sandbox (disable for security)
ENABLE_NETWORK=false

# Maintenance mode (set to true to disable submissions temporarily)
MAINTENANCE_MODE=false
